name: Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build DriftTool.exe (fails unless it is a windowed desktop app)
        shell: cmd
        run: build-windows.bat

      - name: Smoke test - exe starts its server with no console
        shell: pwsh
        run: |
          $p = Start-Process dist\DriftTool\DriftTool.exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep 1
            try { Invoke-WebRequest http://127.0.0.1:5057/ -UseBasicParsing -TimeoutSec 2 | Out-Null; $ok = $true; break } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Get-Content dist\DriftTool\work\desktop.log -ErrorAction SilentlyContinue; throw "DriftTool.exe did not start" }

      - name: Package dist folder
        shell: pwsh
        run: Compress-Archive -Path dist\DriftTool\* -DestinationPath DriftTool-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: DriftTool-windows
          path: DriftTool-windows.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: DriftTool-windows.zip
