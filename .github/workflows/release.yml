name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build DriftTool.exe
        shell: cmd
        run: build-windows.bat

      - name: Package dist folder
        shell: pwsh
        run: Compress-Archive -Path dist\DriftTool\* -DestinationPath DriftTool-windows.zip -Force

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: DriftTool-windows.zip
